[workspace.package]
edition = "2024"
version = "1.0.0"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/willkirkmanm/x-lang"
homepage = "https://github.com/willkirkmanm/x-lang"

[workspace]
resolver = "3"
members = [
  "x-diagnostics",
  "x-utils",
  "x-logging",
  "x-proofs",
  "x-differential",
  "x-clean",
  "x-runtime",
  "x-ast",
  "x-std",
  "x-parser",
  "x-borrow-checker",
  "x-hir",
  "x-mir",
  "x-typechecker",
  "x-project",
  "x-codegen",
  "x-link",
  "x-compile",
  "x-driver",
  "x-cli",
  "x-alive",
]

[workspace.dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
inkwell = { version = "=0.9.0", default-features = false, features = [
  "llvm22-1",
  "target-x86",
  "target-riscv",
] }
pest = "=2.8.7"
pest_derive = "=2.8.7"
proc-macro2 = { version = "=1.0.106", features = ["span-locations"] }
quote = "=1.0.46"
regex = "=1.13.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
syn = { version = "=2.0.119", features = ["full", "visit", "visit-mut", "extra-traits"] }
thiserror = "=2.0.18"
toml = "=1.1.3"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
unicode-width = "=0.2.2"
walkdir = "=2.5.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Registry"] }

x-alive = { path = "x-alive" }
x-ast = { path = "x-ast" }
x-borrow-checker = { path = "x-borrow-checker" }
x-cli = { path = "x-cli" }
x-clean = { path = "x-clean" }
x-codegen = { path = "x-codegen" }
x-compile = { path = "x-compile" }
x-diagnostics = { path = "x-diagnostics" }
x-differential = { path = "x-differential" }
x-driver = { path = "x-driver" }
x-hir = { path = "x-hir" }
x-link = { path = "x-link" }
x-logging = { path = "x-logging" }
x-mir = { path = "x-mir" }
x-parser = { path = "x-parser" }
x-project = { path = "x-project" }
x-proofs = { path = "x-proofs" }
x-runtime = { path = "x-runtime" }
x-std = { path = "x-std" }
x-typechecker = { path = "x-typechecker" }
x-utils = { path = "x-utils" }
